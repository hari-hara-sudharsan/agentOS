# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}-backend
  labels:
    {{- include "agentos.backend.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "agentos.backend.selectorLabels" . | nindent 4 }}

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}-frontend
  labels:
    {{- include "agentos.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "agentos.frontend.selectorLabels" . | nindent 4 }}

---
# Redis Service
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}-redis
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    {{- include "agentos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
